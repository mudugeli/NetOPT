@Composable
fun HomeScreen(vm: HomeViewModel = viewModel()) {
    val shizukuState by vm.shizukuState.collectAsState()
    val config by vm.config.collectAsState()
    val snapshot by vm.snapshot.collectAsState()

    Column(
        modifier = Modifier
            .fillMaxSize()
            .background(Color(0xFF0F0F0F))
            .verticalScroll(rememberScrollState())
            .padding(16.dp),
        verticalArrangement = Arrangement.spacedBy(12.dp)
    ) {

        // ── Shizuku 状态条 ───────────────────────────────────────────
        ShizukuStatusBanner(shizukuState) { vm.requestShizuku() }

        // ── 实时网速卡片 ─────────────────────────────────────────────
        SectionLabel("实时网络")
        SpeedCard(snapshot)

        // ── 优化功能 ─────────────────────────────────────────────────
        SectionLabel("优化功能")

        DnsCard(
            enabled = config.dnsEnabled,
            provider = config.dnsProvider,
            onToggle = { vm.toggleDns(it) },
            onProviderSelect = { vm.setDnsProvider(it) },
            onFlushCache = { vm.flushDns() }
        )

        TcpCard(
            enabled = config.tcpTuningEnabled,
            algorithm = config.tcpAlgorithm,
            onToggle = { vm.toggleTcpTuning(it) },
            onAlgoSelect = { vm.setTcpAlgorithm(it) }
        )

        NetworkIsolationCard(
            enabled = config.networkIsolationEnabled,
            restrictedCount = config.restrictedUids.size,
            onToggle = { vm.toggleNetworkIsolation(it) }
        )

        Spacer(Modifier.height(80.dp))
    }
}

// ── 子组件 ────────────────────────────────────────────────────────────

@Composable
fun ShizukuStatusBanner(
    state: ShizukuBridge.State,
    onConnect: () -> Unit
) {
    val (bg, border, icon, title, sub, showBtn) = when (state) {
        is ShizukuBridge.State.Connected ->
            BannerStyle(0xFF1A1A2E, 0xFF2A2A5E, "✓", "已连接 · 特权模式", "v${state.version} · shell uid=2000", false)
        is ShizukuBridge.State.Connecting ->
            BannerStyle(0xFF1A1A1A, 0xFF333333, "⟳", "连接中...", "正在请求权限", false)
        is ShizukuBridge.State.Error ->
            BannerStyle(0xFF2A1A1A, 0xFF5A2A2A, "!", state.msg, "点击重试", true)
        ShizukuBridge.State.Disconnected ->
            BannerStyle(0xFF1A1A1A, 0xFF333333, "○", "Shizuku 未连接", "需要 Shizuku 特权权限", true)
    }

    Row(
        modifier = Modifier
            .fillMaxWidth()
            .clip(RoundedCornerShape(14.dp))
            .background(Color(bg))
            .border(1.dp, Color(border), RoundedCornerShape(14.dp))
            .padding(14.dp),
        verticalAlignment = Alignment.CenterVertically,
        horizontalArrangement = Arrangement.spacedBy(12.dp)
    ) {
        Surface(
            shape = RoundedCornerShape(8.dp),
            color = Color(0xFF4338CA),
            modifier = Modifier.padding(0.dp)
        ) {
            Text(
                "Shizuku",
                modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp),
                color = Color(0xFFC4B5FD), fontSize = 11.sp, fontWeight = FontWeight.SemiBold
            )
        }
        Column(Modifier.weight(1f)) {
            Text(title, color = Color(0xFFA5B4FC), fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
            Text(sub, color = Color(0xFF6366F1), fontSize = 11.sp)
        }
        if (showBtn) {
            TextButton(onClick = onConnect) {
                Text("连接", color = Color(0xFF60A5FA), fontSize = 12.sp)
            }
        } else {
            Box(
                Modifier
                    .size(8.dp)
                    .clip(RoundedCornerShape(50))
                    .background(Color(0xFF4ADE80))
            )
        }
    }
}

data class BannerStyle(
    val bg: Long, val border: Long, val icon: String,
    val title: String, val sub: String, val showBtn: Boolean
)

@Composable
fun SectionLabel(text: String) {
    Text(
        text.uppercase(),
        color = Color(0xFF555555), fontSize = 11.sp,
        fontWeight = FontWeight.SemiBold, letterSpacing = 0.8.sp,
        modifier = Modifier.padding(horizontal = 2.dp)
    )
}

@Composable
fun SpeedCard(snapshot: NetworkSnapshot) {
    NetCard {
        CardHeader(
            iconBg = Color(0xFF0A1A3A),
            iconTint = Color(0xFF60A5FA),
            iconVector = Icons.Rounded.Bolt,
            title = "网速监控",
            trailing = {
                Surface(shape = RoundedCornerShape(4.dp), color = Color(0xFF0A2A1A)) {
                    Text("实时", color = Color(0xFF4ADE80), fontSize = 10.sp,
                        modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp))
                }
            }
        )
        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
            MetricBox("↑ %.0f".format(snapshot.uploadMbps), "Mbps 上传", Color(0xFF60A5FA))
            MetricBox("↓ %.0f".format(snapshot.downloadMbps), "Mbps 下载", Color(0xFF4ADE80))
            MetricBox("%.0f".format(snapshot.latencyMs), "ms 延迟", Color(0xFFFBBF24))
        }
        Spacer(Modifier.height(8.dp))
        Row(
            modifier = Modifier.fillMaxWidth(),
            horizontalArrangement = Arrangement.SpaceBetween
        ) {
            Text("${snapshot.ssid}  ${snapshot.signalDbm} dBm",
                color = Color(0xFF555555), fontSize = 11.sp)
            Text(snapshot.signalQuality.label,
                color = Color(snapshot.signalQuality.colorRes.toLong()), fontSize = 11.sp)
        }
    }
}

@Composable
fun DnsCard(
    enabled: Boolean, provider: String,
    onToggle: (Boolean) -> Unit,
    onProviderSelect: (String) -> Unit,
    onFlushCache: () -> Unit
) {
    val presets = listOf("1.1.1.1", "dns.google", "doh.pub", "dns.alidns.com")
    NetCard {
        CardHeader(
            iconBg = Color(0xFF0A2A1A), iconTint = Color(0xFF4ADE80),
            iconVector = Icons.Rounded.Speed, title = "DNS 加速",
            subtitle = "$provider · DoH/DoT",
            trailing = { NetSwitch(enabled, onToggle) }
        )
        AnimatedVisibility(enabled) {
            Column {
                Spacer(Modifier.height(8.dp))
                Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                    presets.forEach { preset ->
                        FilterChip(
                            selected = provider == preset,
                            onClick = { onProviderSelect(preset) },
                            label = { Text(preset, fontSize = 11.sp) }
                        )
                    }
                }
                Spacer(Modifier.height(8.dp))
                Row(
                    modifier = Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.SpaceBetween,
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Text("当前: $provider", color = Color(0xFF555555), fontSize = 12.sp)
                    TextButton(onClick = onFlushCache) {
                        Text("刷新缓存", color = Color(0xFF60A5FA), fontSize = 12.sp)
                    }
                }
            }
        }
    }
}

@Composable
fun TcpCard(
    enabled: Boolean, algorithm: TcpAlgorithm,
    onToggle: (Boolean) -> Unit,
    onAlgoSelect: (TcpAlgorithm) -> Unit
) {
    NetCard {
        CardHeader(
            iconBg = Color(0xFF2A1A00), iconTint = Color(0xFFFBBF24),
            iconVector = Icons.Rounded.Tune, title = "TCP 优化",
            subtitle = "${algorithm.displayName} · 需 Shizuku",
            trailing = { NetSwitch(enabled, onToggle) }
        )
        AnimatedVisibility(enabled) {
            Column {
                Spacer(Modifier.height(8.dp))
                OptionRow("拥塞算法", algorithm.displayName)
                Divider(color = Color(0xFF222222))
                OptionRow("发送缓冲", "4 MB")
                Divider(color = Color(0xFF222222))
                OptionRow("TCP Fast Open", "已启用")
                Divider(color = Color(0xFF222222))
                OptionRow("BBR 内核支持", "检测中…")
            }
        }
    }
}

@Composable
fun NetworkIsolationCard(
    enabled: Boolean, restrictedCount: Int,
    onToggle: (Boolean) -> Unit
) {
    NetCard {
        CardHeader(
            iconBg = Color(0xFF1A0A3A), iconTint = Color(0xFFA78BFA),
            iconVector = Icons.Rounded.Security, title = "网络隔离",
            subtitle = "应用级流量管控",
            trailing = { NetSwitch(enabled, onToggle) }
        )
        AnimatedVisibility(enabled) {
            Column {
                Spacer(Modifier.height(8.dp))
                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    MetricBox("$restrictedCount", "受限应用", Color(0xFFA78BFA))
                    MetricBox("0", "仅WiFi", Color(0xFF60A5FA))
                    MetricBox("0", "后台限制", Color(0xFFFBBF24))
                }
            }
        }
    }
}

// ── 原子组件 ──────────────────────────────────────────────────────────

@Composable
fun NetCard(content: @Composable ColumnScope.() -> Unit) {
    Column(
        modifier = Modifier
            .fillMaxWidth()
            .clip(RoundedCornerShape(16.dp))
            .background(Color(0xFF1A1A1A))
            .border(1.dp, Color(0xFF2A2A2A), RoundedCornerShape(16.dp))
            .padding(16.dp),
        content = content
    )
}

@Composable
fun CardHeader(
    iconBg: Color, iconTint: Color,
    iconVector: androidx.compose.ui.graphics.vector.ImageVector,
    title: String, subtitle: String = "",
    trailing: @Composable () -> Unit = {}
) {
    Row(
        verticalAlignment = Alignment.CenterVertically,
        horizontalArrangement = Arrangement.spacedBy(10.dp),
        modifier = Modifier.padding(bottom = 4.dp)
    ) {
        Box(
            Modifier.size(36.dp).clip(RoundedCornerShape(10.dp)).background(iconBg),
            contentAlignment = Alignment.Center
        ) {
            Icon(iconVector, null, tint = iconTint, modifier = Modifier.size(18.dp))
        }
        Column(Modifier.weight(1f)) {
            Text(title, color = Color(0xFFE5E5E5), fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
            if (subtitle.isNotEmpty())
                Text(subtitle, color = Color(0xFF555555), fontSize = 11.sp)
        }
        trailing()
    }
}

@Composable
fun MetricBox(value: String, label: String, valueColor: Color) {
    Column(
        modifier = Modifier
            .clip(RoundedCornerShape(10.dp))
            .background(Color(0xFF111111))
            .padding(horizontal = 12.dp, vertical = 10.dp),
        horizontalAlignment = Alignment.CenterHorizontally
    ) {
        Text(value, color = valueColor, fontSize = 18.sp, fontWeight = FontWeight.Bold)
        Text(label, color = Color(0xFF555555), fontSize = 10.sp)
    }
}

@Composable
fun OptionRow(key: String, value: String) {
    Row(
        Modifier.fillMaxWidth().padding(vertical = 8.dp),
        horizontalArrangement = Arrangement.SpaceBetween,
        verticalAlignment = Alignment.CenterVertically
    ) {
        Text(key, color = Color(0xFFAAAAAA), fontSize = 13.sp)
        Surface(shape = RoundedCornerShape(6.dp), color = Color(0xFF0A1A3A)) {
            Text(value, color = Color(0xFF60A5FA), fontSize = 12.sp,
                modifier = Modifier.padding(horizontal = 8.dp, vertical = 3.dp))
        }
    }
}

@Composable
fun NetSwitch(checked: Boolean, onCheckedChange: (Boolean) -> Unit) {
    Switch(
        checked = checked,
        onCheckedChange = onCheckedChange,
        colors = SwitchDefaults.colors(
            checkedThumbColor = Color.White,
            checkedTrackColor = Color(0xFF0066FF),
            uncheckedThumbColor = Color(0xFF888888),
            uncheckedTrackColor = Color(0xFF2A2A2A),
        )
    )
}
